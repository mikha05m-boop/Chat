<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Public chat</title>
<style>
:root{--bg:#eef0f5;--panel:#fff;--text:#1b1d26;--muted:#80849a;--me:#5b5bf0;--me2:#7b6cf6;--me-t:#fff;--them:#f1f2f7;--line:#e6e8f0;--shadow:0 10px 40px rgba(40,40,90,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f14;--panel:#171821;--text:#ecedf3;--muted:#8a8da3;--them:#232532;--line:#272938;--shadow:0 10px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0e0f14;--panel:#171821;--text:#ecedf3;--muted:#8a8da3;--them:#232532;--line:#272938;--shadow:0 10px 40px rgba(0,0,0,.5)}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
#app{display:flex;flex-direction:column;width:100%;max-width:560px;height:100%;max-height:900px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
@media (min-width:600px){#app{height:92%;border-radius:22px}}
header{padding:16px 18px;background:linear-gradient(135deg,var(--me),var(--me2));color:#fff;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;letter-spacing:-.2px}
header small{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.92}
header small::before{content:"";width:8px;height:8px;border-radius:50%;background:#5df0a0}
#msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:flex-end;gap:8px;max-width:84%}
.row.me{align-self:flex-end}
.col{display:flex;flex-direction:column;min-width:0}
.me .col{align-items:flex-end}
.av{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.who{font-size:12px;font-weight:600;color:var(--muted);margin:8px 10px 3px}
.b{padding:9px 14px;border-radius:20px;border-bottom-left-radius:6px;background:var(--them);overflow-wrap:anywhere;white-space:pre-wrap}
.me .b{background:linear-gradient(135deg,var(--me),var(--me2));color:var(--me-t);border-radius:20px;border-bottom-right-radius:6px}
.t{font-size:11px;color:var(--muted);margin:3px 10px 4px}
.empty{text-align:center;color:var(--muted);margin:auto;font-size:15px}
#note{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px;background:var(--them)}
#f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--them);border:2px solid transparent;border-radius:24px;padding:11px 18px;outline:none}
input:focus{border-color:var(--me)}
button{font:inherit;font-weight:600;border:0;border-radius:24px;padding:0 22px;background:linear-gradient(135deg,var(--me),var(--me2));color:#fff;cursor:pointer}
button:active{transform:scale(.97)}
#gate{position:fixed;inset:0;z-index:9;background:linear-gradient(135deg,var(--me),var(--me2));display:flex;align-items:center;justify-content:center;padding:20px}
#nf{background:var(--panel);border-radius:24px;padding:32px 26px;width:min(340px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;text-align:center}
#nf .logo{font-size:40px}
#nf h2{margin:0;font-size:24px}
#nf p{margin:0 0 6px;color:var(--muted)}
#nf button{padding:13px;font-size:16px}
</style>
</head>
<body>
<div id="gate"><form id="nf" autocomplete="off"><div class="logo">💬</div><h2>Join the chat</h2><p>Pick a name to get started.</p><input id="nm" placeholder="Your name" maxlength="24" required><button type="submit">Join</button></form></div>
<div id="app">
  <header><b>Public chat</b><small id="status">Connecting…</small></header>
  <div id="note" hidden></div>
  <div id="msgs"><div class="empty">No messages yet. Say hello! 👋</div></div>
  <form id="f" autocomplete="off"><input id="in" placeholder="Write a message…" maxlength="1000"><button type="submit">Send</button></form>
</div>
<script>
const $=id=>document.getElementById(id);
const msgsEl=$("msgs"),statusEl=$("status"),noteEl=$("note");
let db=null,room=null,myName="",list=[];
const myId=(()=>{try{let v=localStorage.getItem("cid");if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem("cid",v)}return v}catch(e){return Math.random().toString(36).slice(2,10)}})();
function fmt(ts){try{return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function render(){
  if(!list.length){msgsEl.innerHTML='<div class="empty">No messages yet. Say hello!</div>';return}
  const near=msgsEl.scrollHeight-msgsEl.scrollTop-msgsEl.clientHeight<120;
  msgsEl.textContent="";let prev=null;
  for(const m of list){
    const mine=m.cid===myId,row=document.createElement("div");row.className="row "+(mine?"me":"them");
    const nm=m.name||"Anonymous",first=m.cid!==prev;
    if(!mine){const av=document.createElement("div");av.className="av";av.style.background=hue(m.cid);av.textContent=first?nm[0].toUpperCase():"";row.appendChild(av)}
    const col=document.createElement("div");col.className="col";
    if(!mine&&first){const w=document.createElement("div");w.className="who";w.textContent=nm;col.appendChild(w)}
    const b=document.createElement("div");b.className="b";b.textContent=m.text;col.appendChild(b);
    const t=document.createElement("div");t.className="t";t.textContent=fmt(m.ts);col.appendChild(t);
    row.appendChild(col);msgsEl.appendChild(row);prev=m.cid;
  }
  if(near||list.length<=1)msgsEl.scrollTop=msgsEl.scrollHeight;
}
function hue(id){let x=0;for(const ch of String(id))x=(x*31+ch.charCodeAt(0))%360;return "hsl("+x+" 55% 48%)"}
function note(t){noteEl.hidden=!t;noteEl.textContent=t||""}
try{myName=localStorage.getItem("cname")||""}catch(e){}
if(myName){$("gate").hidden=true}else{$("nm").focus()}
$("nf").addEventListener("submit",e=>{
  e.preventDefault();const n=$("nm").value.trim().slice(0,24);if(!n)return;
  myName=n;try{localStorage.setItem("cname",n)}catch(e){}
  $("gate").hidden=true;$("in").focus();
});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("in").value.trim();if(!text||!myName)return;
  $("in").value="";
  const msg={text:text.slice(0,1000),name:myName,cid:myId,ts:Date.now()};
  try{
    if(db){await db.collection("messages").add(msg)}
    else if(room){await room.emit("msg",msg);list.push(msg);render()}
    else{list.push(msg);render()}
  }catch(err){note("Couldn't send that message.");$("in").value=text}
});
(async()=>{
  const c=window.claude;
  try{if(c&&c.use){db=await c.use("db");if(!db)room=await c.use("room")}}catch(e){}
  if(db){
    statusEl.textContent="Live";
    db.collection("messages").orderBy("ts","desc").limit(100).onSnapshot(
      s=>{list=s.docs.map(d=>d.data()).reverse();render()},
      er=>{statusEl.textContent="Offline";note("Can't load messages ("+er.code+").")});
  }else if(room){
    statusEl.textContent="Live (no history)";
    note("Messages appear live for people here now and aren't saved.");
    room.on("msg",m=>{const d=m.data;if(d&&typeof d.text==="string"&&!m.isMe){list.push({text:d.text.slice(0,1000),name:String(d.name||"").slice(0,24),cid:String(d.cid||m.peer),ts:Date.now()});if(list.length>200)list.shift();render()}});
  }else{
    statusEl.textContent="Local only";
    note("Live chat isn't available in this view. Messages stay on this page.");
  }
})();
</script>
</body>
</html>
